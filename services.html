<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اطلب مشروعك | إدارة وتطوير ابو حازم العمري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- شريط التنقل العلوي -->
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-blue-600 p-2 rounded-xl text-white font-bold text-xl shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-code"></i>
                </div>
                <span class="text-xl font-black bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
                    إدارة وتطوير ابو حازم العمري
                </span>
            </div>
            <nav class="hidden md:flex items-center space-x-6 space-x-reverse font-semibold">
                <a href="index.html" class="hover:text-blue-400 transition">الرئيسية</a>
                <a href="services.html" class="text-blue-400 transition">اطلب مشروعك</a>
                <a href="careers.html" class="hover:text-blue-400 transition">الوظائف</a>
                <a href="admin.html" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm transition border border-slate-600">
                    <i class="fa-solid fa-lock ml-1"></i> لوحة التحكم
                </a>
            </nav>
        </div>
    </header>

    <!-- محتوى صفحة الطلبات -->
    <main class="flex-grow max-w-4xl mx-auto px-4 py-12 w-full">
        <div class="bg-slate-800/60 border border-slate-700 p-8 rounded-2xl shadow-xl">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black mb-2">تقديم طلب مشروع جديد</h1>
                <p class="text-slate-400">املأ النموذج أدناه بتفاصيل مشروعك أو فكرتك وسنتواصل معك فوراً</p>
            </div>

            <form id="serviceForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold mb-2">الاسم الكامل</label>
                        <input type="text" id="clientName" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition" placeholder="أدخل اسمك هنا">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">البريد الإلكتروني أو وسائل التواصل</label>
                        <input type="text" id="clientContact" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition" placeholder="بريدك أو رقم هاتفك">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">نوع المشروع المطلوب</label>
                    <select id="projectType" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition">
                        <option value="تطوير موقع ويب متكامل">تطوير موقع ويب متكامل</option>
                        <option value="متجر إلكتروني">متجر إلكتروني</option>
                        <option value="برمجة تطبيق تفاعلي / لعبة">برمجة تطبيق تفاعلي / لعبة</option>
                        <option value="تعديل وتطوير واجهات">تعديل وتطوير واجهات (Frontend)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">تفاصيل وفكرة المشروع</label>
                    <textarea id="projectDetails" rows="4" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition" placeholder="اكتب تفاصيل المشروع والميزات التي تريدها..."></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">إرفاق ملفات أو مستندات (اختياري)</label>
                    <input type="file" id="projectFile" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-slate-400 file:ml-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-600/30 transition">
                    <i class="fa-solid fa-paper-plane ml-2"></i> إرسال الطلب الآن
                </button>
            </form>

            <div id="successMessage" class="hidden mt-6 p-4 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 rounded-xl text-center font-bold">
                ✨ تم إرسال طلبك بنجاح وسجل في النظام بنجاح!
            </div>
        </div>
    </main>

    <!-- التذييل -->
    <footer class="bg-slate-800 border-t border-slate-700 py-6 text-center text-slate-400 text-sm">
        <p>جميع الحقوق محفوظة © 2026 - إدارة وتطوير ابو حازم العمري</p>
    </footer>

    <!-- ربط السكريبت المشترك -->
    <script src="script.js"></script>
    <script>
        // معالجة إرسال نموذج الخدمات
        document.getElementById('serviceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                type: 'service',
                name: document.getElementById('clientName').value,
                contact: document.getElementById('clientContact').value,
                projectType: document.getElementById('projectType').value,
                details: document.getElementById('projectDetails').value,
                fileName: document.getElementById('projectFile').files[0] ? document.getElementById('projectFile').files[0].name : 'لا يوجد ملف',
                date: new Date().toLocaleDateString('ar-EG')
            };
            saveSubmission(data);
            this.reset();
            document.getElementById('successMessage').classList.remove('hidden');
            setTimeout(() => document.getElementById('successMessage').classList.add('hidden'), 4000);
        });
    </script>
</body>
</html>
